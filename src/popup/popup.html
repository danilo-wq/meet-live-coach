<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Meet Live Coach</title>
  <link rel="icon" type="image/svg+xml" href="https://ggvinteligencia.com.br/wp-content/uploads/2024/05/Favicon-GGV.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    :root { --ggv-navy:#002060; --ggv-blue:#33279B; --ggv-teal:#00BA8A; --ggv-mint:#00D38B; --ggv-text:#1b2333; --ggv-muted:#5b6b8a; --ggv-border:#E2E8F0; --ggv-bg:#FFFFFF; --ggv-surface:#F5F7FB; }
    :root { color-scheme: light; }
    body { width: 320px; margin: 0; font-family: 'Montserrat', system-ui, sans-serif; background: var(--ggv-bg); color: var(--ggv-text); }
    header { padding: 14px 16px; border-bottom: 2px solid var(--ggv-teal); display:flex; align-items:center; gap:10px; }
    header img { height: 28px; }
    .sub { color: var(--ggv-muted); font-size: 12px; }
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .status-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; border:1px solid var(--ggv-border); }
    .status-badge.recording { background: rgba(0,186,138,.12); color: var(--ggv-teal); border-color: var(--ggv-teal); }
    .status-badge.recording .dot { background: var(--ggv-teal); box-shadow: 0 0 6px var(--ggv-teal); animation: pulse 1.4s infinite; }
    .status-badge.stopped { background: var(--ggv-surface); color: var(--ggv-muted); }
    .status-badge.stopped .dot { background: #c2cad6; }
    .status-badge.waiting { background: #fff8e6; color: #b8860b; border-color: #f0d878; }
    .status-badge.waiting .dot { background: #e6b800; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status { font-size: 12px; color: var(--ggv-muted); display:flex; align-items:center; gap:6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    button { font: inherit; border: 1px solid var(--ggv-border); background: var(--ggv-bg); color: var(--ggv-navy); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { border-color: var(--ggv-teal); color: var(--ggv-teal); }
    button.primary { background: var(--ggv-teal); color: var(--ggv-navy); border-color: var(--ggv-teal); }
    button.primary:hover { background: var(--ggv-mint); }
    .btns { display: flex; gap: 8px; }
    .btns button { flex: 1; }
    a { color: var(--ggv-blue); text-decoration: none; font-size: 12px; }
    a:hover { color: var(--ggv-teal); }
    .warn { font-size: 11px; color: #c0392b; background: #fdf2f0; border: 1px solid #e6b8b3; padding: 8px; border-radius: 6px; }
    .ok { font-size: 11px; color: var(--ggv-mint); }
    footer { padding: 10px 16px; border-top: 1px solid var(--ggv-border); background: var(--ggv-surface); display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header>
    <img src="https://ggvinteligencia.com.br/wp-content/uploads/2025/08/Logo-GGV-Padrao.png" alt="GGV" />
  </header>
  <main>
    <div class="row">
      <span class="status-badge waiting" id="statusBadge"><span class="dot"></span> <span id="statusText">Verificando…</span></span>
      <span class="status" id="counts"></span>
    </div>
    <div class="btns">
      <button class="primary" id="startBtn">▶ Iniciar</button>
      <button id="stopBtn">⏸ Parar</button>
      <button id="restartBtn">↻ Reiniciar</button>
    </div>
    <div class="btns">
      <button id="collapseBtn">Recolher painel</button>
      <button id="optsBtn">Opções</button>
    </div>
    <div id="msg"></div>
  </main>
  <footer>
    <span>v0.3.3</span>
    <a href="https://ggvinteligencia.com.br" target="_blank" rel="noopener">ggvinteligencia.com.br</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
