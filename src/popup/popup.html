<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Meet Live Coach</title>
  <style>
    :root { color-scheme: dark; }
    body { width: 320px; margin: 0; font-family: 'Google Sans', Roboto, Arial, sans-serif; background: #1f1f1f; color: #e8eaed; }
    header { padding: 14px 16px; border-bottom: 1px solid #3c4043; }
    h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
    .sub { color: #9aa0a6; font-size: 12px; }
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row label { font-size: 13px; }
    .status { font-size: 12px; color: #9aa0a6; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #80868b; box-shadow: 0 0 6px transparent; }
    .dot.on { background: #30a14e; box-shadow: 0 0 6px #30a14e; }
    button { font: inherit; border: 1px solid #3c4043; background: #2a2a2a; color: #e8eaed; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #353535; }
    button.primary { background: #1a73e8; border-color: #1a73e8; }
    button.primary:hover { background: #1765cc; }
    .btns { display: flex; gap: 8px; }
    .btns button { flex: 1; }
    a { color: #8ab4f8; text-decoration: none; font-size: 12px; }
    .warn { font-size: 11px; color: #fdd663; background: #2a2400; border: 1px solid #4a3e00; padding: 8px; border-radius: 6px; }
    .ok { font-size: 11px; color: #30a14e; }
    footer { padding: 10px 16px; border-top: 1px solid #3c4043; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>🎤 Meet Live Coach</h1>
    <div class="sub">Transcrição por canal + coaching de vendas ao vivo</div>
  </header>
  <main>
    <div class="row">
      <span class="status"><span class="dot" id="dot"></span> <span id="statusText">Verificando…</span></span>
      <span class="status" id="counts"></span>
    </div>
    <div class="btns">
      <button class="primary" id="startBtn">Iniciar</button>
      <button id="stopBtn">Parar</button>
    </div>
    <div class="btns">
      <button id="collapseBtn">Recolher painel</button>
      <button id="optsBtn">Opções</button>
    </div>
    <div id="msg"></div>
  </main>
  <footer>
    <span class="sub">v0.1.0</span>
    <a href="#" id="help">Ajuda</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
